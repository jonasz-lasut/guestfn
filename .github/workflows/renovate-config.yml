# The Renovate configuration, checked with Renovate's own validator. It
# runs on a pull request that changes the file and on no other: ci.yml
# skips its jobs for such a change (detect-noop), since no test reads the
# file. --strict also fails on an option Renovate would migrate, so the
# file is kept in the current spelling.
name: Renovate Config

on:
  pull_request:
    paths:
      - '.github/renovate.json5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: 44.252.8

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Validate
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" renovate-config-validator --strict .github/renovate.json5
