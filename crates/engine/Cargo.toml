[package]
name = "guestfn-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "What the engines of guestfn share: the Engine trait the runtime holds them to, the ceilings, the run slots, the metrics, the egress seam and the image layout writer"
publish = false

[dependencies]
# The messages an engine runs a module on: the request it is handed and
# the response it hands back.
function-sdk-rust = "0.6.0"
# The writing half of the OCI image layout, shared by the runtime's resolver
# and the OCI engine's fixtures: a tar of blobs by digest.
hex = "0.4"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
tar = "0.4"

prometheus-client = "0.26.0"
thiserror = "2"
