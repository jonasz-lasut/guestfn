# cargo-deny: the dependency gate CI runs on every pull request (ci.yml, the
# deny job) and once a week beside the image scan (grype-scan.yml). An
# advisory against a crate in Cargo.lock fails the run; the fix is a bump,
# or an entry in `ignore` naming the advisory id with a comment saying why
# it does not apply here.

[graph]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# A yanked crate is a warning: Renovate moves the pin, and the advisory, if
# there is one, fails on its own.
yanked = "warn"
# Each entry: { id = "RUSTSEC-YYYY-NNNN", reason = "why it does not apply" }.
ignore = [
    # chrono is unmaintained, with no patched release to move to. No crate
    # of the workspace names it. It comes in twice: cedar-policy-core's
    # default `datetime` feature (Cedar's datetime and duration extension
    # types) and pbjson-types, whose Timestamp and Duration are
    # function-sdk-rust's well-known types. Both build it without default
    # features, so its clock and local time zone code isn't compiled.
    # The runtime builds cedar-policy with its default features, and
    # building it without them wouldn't drop chrono: cedar-policy and
    # cedar-policy-formatter take cedar-policy-core with its defaults
    # (cedar-policy/cedar#2707). Remove the entry once neither needs
    # chrono: a Cedar release that moved off it (#409), and
    # function-sdk-rust on a pbjson-types release without it (#412,
    # influxdata/pbjson#162).
    { id = "RUSTSEC-2026-0543", reason = "transitive through cedar-policy-core (datetime) and pbjson-types, no patched release; neither path compiles chrono's clock" },
]

[licenses]
version = 2
# The licenses the workspace's dependency graph uses today; a crate under
# another license fails the run until it is added here deliberately.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
# The wasm-tools crates guestfn build componentizes with are the copies
# wasmtime's own bindgen pulls (crates/engine-wasm/Cargo.toml): a second
# version of one means a guest is embedded and wrapped by another
# wasm-tools release than the engine reads it with. The fix is in the
# lockfile, `cargo update <crate>@<old> --precise <the version wasmtime
# pulls>`; wasm-encoder is here for wat, which the fixtures and wasmtime
# share.
deny = [
    { crate = "wit-component", deny-multiple-versions = true },
    { crate = "wit-parser", deny-multiple-versions = true },
    { crate = "wasmparser", deny-multiple-versions = true },
    { crate = "wasm-encoder", deny-multiple-versions = true },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
